name: minimal-api-performance-demo-integration-tests

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: performancedemo-integration-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      SQLSERVER_DATABASE: PerformanceDemo
      SQLSERVER_USER: sa
    ports:
      - "14333:1433"
    volumes:
      - performancedemo-integration-sqlserver-data:/var/opt/mssql
      - ../seed:/seed:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  performancedemo-integration-sqlserver-data:
    name: performancedemo-integration-sqlserver-data
