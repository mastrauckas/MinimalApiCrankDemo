name: minimal-api-crank-demo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crankdemo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - crankdemo-sqlserver-data:/var/opt/mssql
      - ./seed:/seed:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  crankdemo-sqlserver-data:
    name: crankdemo-sqlserver-data
